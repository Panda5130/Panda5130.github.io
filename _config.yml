# ---------------------------------------------------------------------------
# Site settings. Edit these, push, and the site redeploys on its own.
# ---------------------------------------------------------------------------
title: Shivam Panda
description: Student at the University of Michigan. Notes, projects and writing.
url: https://panda5130.github.io
baseurl: ""
lang: en
email: shivpan@umich.edu

# Profile links. Leave a value empty to hide that link.
links:
  substack: https://substack.com/@shivampanda
  linkedin: https://www.linkedin.com/in/shivam-panda-uofm/
  github: https://github.com/Panda5130

# Your own Substack publication (e.g. https://yourname.substack.com).
# When set, its latest posts appear on the home page. Leave empty until you publish.
substack_feed: ""
# How many recent Substack posts to show on the home page.
substack_posts: 5

# Google Search Console: paste the "HTML tag" content value here.
webmaster_verifications:
  google: "4vVAx8IxI-P3sXh_R0v85F6Py5E5_l_NDIy-VbdvQ78"

# ---------------------------------------------------------------------------
# Build settings. No need to touch these.
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope: { type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: default }
exclude:
  - README.md
  - scripts
